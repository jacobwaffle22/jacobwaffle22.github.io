al newline, so the output is 3-x-4! with no newline."}, {"q": "Which of these is a semantic (logic) error?", "code": null, "opts": ["Forgetting the colon after a def line", "Calling int(\"hello\")", "Computing an average as total / count + 1", "Misspelling print as pirnt", "Leaving a quotation mark unclosed"], "ans": 2, "why": "The program runs and finishes but the answer is wrong. The others are syntax errors or runtime errors."}, {"q": "What is the value of 17 // 5 + 17 % 5 ?", "code": null, "opts": ["5", "3", "2", "6", "5.4"], "ans": 0, "why": "17 // 5 is 3 and 17 % 5 is 2, so 3 + 2 = 5."}, {"q": "What type of value does the expression 8 / 2 produce?", "code": null, "opts": ["int", "float", "str", "bool", "It produces an error"], "ans": 1, "why": "The / operator always produces a float, so the result is 4.0."}, {"q": "What is the decimal value of the binary number 101101 ?", "code": null, "opts": ["45", "43", "37", "54", "90"], "ans": 0, "why": "32 + 8 + 4 + 1 = 45."}, {"q": "What is the decimal value of the hexadecimal number 3F ?", "code": null, "opts": ["63", "45", "15", "48", "57"], "ans": 0, "why": "3 x 16 + 15 = 63."}, {"q": "What does this code print?", "code": "total = 0\nfor i in range(2, 10, 3):\n    total += i\nprint(total)", "opts": ["10", "15", "21", "12", "2"], "ans": 1, "why": "range(2, 10, 3) gives 2, 5, 8 and 2 + 5 + 8 = 15."}, {"q": "What does this code print?", "code": "def f(n):\n    for i in range(n):\n        if i * i > 10:\n            return i\n    return -1\n\nprint(f(10), f(3))", "opts": ["4 -1", "4 3", "-1 -1", "11 -1", "4 None"], "ans": 0, "why": "f(10): i = 0,1,2,3 give 0,1,4,9 (not above 10), i = 4 gives 16 so it returns 4. f(3) checks i = 0,1,2 and never returns inside the loop, so it returns -1."}, {"q": "Which expression is equivalent to not (a and b) ?", "code": null, "opts": ["not a and not b", "not a or not b", "a or b", "not a or b", "a and not b"], "ans": 1, "why": "De Morgan's law: negating an and gives an or of the negation he program prints Got it in __ guesses, counting only the valid guesses.", "sol": "import random\nsecret = random.randint(1, 100)\nguesses = 0\nguess = int(input(\"Guess: \"))\nwhile guess != secret:\n    if guess < 1 or guess > 100:\n        print(\"Out of range\")\n    else:\n        guesses += 1\n        if guess < secret:\n            print(\"Too low\")\n        else:\n            print(\"Too high\")\n    guess = int(input(\"Guess: \"))\nguesses += 1\nprint(f\"Got it in {guesses} guesses\")", "marks_scheme": "1 for the import and randint(1, 100), 2 for a while loop that stops at the right time, 2 for the range check, 2 for Too low / Too high, 1 for counting valid guesses (including the final correct one), 1 for the final message."}]}, "examB": {"mc": [{"q": "What does this statement print?", "code": "print(f\"{3.14159:.2f}|{7:4}|\")", "opts": ["3.14|7|", "3.14|   7|", "3.1|   7|", "3.14159|7|", "3.14|7   |"], "ans": 1, "why": ":.2f gives two decimals and :4 sets a width of 4. Numbers are right-aligned, so 7 gets three spaces before it."}, {"q": "Which statement best describes Python's interpreter?", "code": null, "opts": ["It translates the whole program into machine code, then runs it", "It translates and runs the code one line at a time", "It helps you write code with autocomplete", "It converts hexadecimal to binary", "It checks your code for logic errors"], "ans": 1, "why": "A compiler translates everything first. An interpreter works line by line. Autocomplete is an IDE feature."}, {"q": "What does 5 + int(2.9) * 2 evaluate to?", "code": null, "opts": ["9", "10.8", "11", "9.8", "7"], "ans": 0, "why": "int(2.9) is 2 (it truncates), then 2 * 2 = 4 and 5 + 4 = 9."}, {"q": "What does -9 // 4 evaluate to?", "code": null, "opts": ["-2", "-3", "-2.25", "2", "-2.5"], "ans": 1, "why": "Floor division rounds toward negative infinity. -2.25 rounds down to -3."}, {"q": "Which binary number equals decimal 37?", "code": null, "opts": ["100101", "100011", "101001", "11000 does this code print?", "code": "score = 85\nif score >= 50:\n    print(\"pass\")\nelif score >= 80:\n    print(\"good\")\nelse:\n    print(\"fail\")", "opts": ["pass", "pass and then good", "good", "fail", "Nothing"], "ans": 0, "why": "In a chained elif, only the first true branch runs. 85 >= 50 is True so it prints pass and skips the rest."}, {"q": "What does this code print?", "code": "total = 0\nn = 5\nwhile n > 0:\n    total += n\n    n -= 2\nprint(total, n)", "opts": ["9 -1", "9 1", "8 -1", "6 1", "5 -1"], "ans": 0, "why": "n goes 5, 3, 1, then -1. total adds 5 + 3 + 1 = 9. The loop stops when n is -1."}, {"q": "Which sequence does range(10, 0, -2) produce?", "code": null, "opts": ["10, 8, 6, 4, 2", "10, 8, 6, 4, 2, 0", "9, 7, 5, 3, 1", "10, 9, 8, ..., 1", "It produces no values"], "ans": 0, "why": "The stop value is never included, so it ends at 2."}], "app": [{"marks": 8, "title": "Digit sum", "q": "Write a function digit_sum(n) that returns the sum of the digits of a positive integer n. For example digit_sum(4096) returns 19. Do not convert n to a string: use % and //. Then write one line that reads an integer from the user and prints its digit sum.", "sol": "def digit_sum(n):\n    total = 0\n    while n > 0:\n        total += n % 10\n        n = n // 10\n    return total\n\nprint(digit_sum(int(input(\"n: \"))))", "marks_scheme": "1 for the def line, 1 for the accumulator starting at 0, 2 for a correct while condition and that it ends, 2 for n % 10 added each time and n // 10 to drop the digit, 1 for returning (not printing), 1 for the one-line call."}, {"marks": 8, "title": "Triangle of dots", "q": "Assume t is a turtle that is already created. Use a nested for loop to draw a triangle of dots. Row 0 (the bottom row) has 1 dot, row 1 has 2 dots, and so on up to row 4, which has 5 dots. Dots are 40 px apart horizontally and each row is 40 px above the one before. The first dot is at (-100, -100). Use t.dot(12). The turtle should not draw lines between dots.", "sol": "t.up()\nfor row in range(5):\n    for col in range(row + 1):\n        t.goto(-100 + col * 40, -100 + row * 40)\n        t.dot(12)", "marks_scheme": "1 for pen up, 2 for the outer loop over 5 rows, 2 for an inner loop that runs row + 1 times, 2 for correct x and y with the 40 px spacing from (-100, -100), 1 for the dot call."}, {"marks": 9, "title": "Prime counter (challenge)", "q": "Write a function is_prime(n) that returns True if n is prime and False otherwise. It should be efficient: do not test divisors larger than the square root of n. Then write a program that reads a positive integer n and prints how many primes are between 2 and n, inclusive. Sample run:\n\nEnter n: 30\nThere are 10 primes up to 30", "sol": "def is_prime(n):\n    if n < 2:\n        return False\n    i = 2\n    while i * i <= n:\n        if n % i == 0:\n            return False\n        i += 1\n    return True\n\nn = int(input(\"Enter n: \"))\ncount = 0\nfor k in range(2, n + 1):\n    if is_prime(k):\n        count += 1\nprint(f\"There are {count} primes up to {n}\")", "marks_scheme": "1 for handling n < 2, 3 for a correct divisor loop that stops at the square root (i * i <= n or math.sqrt), 1 for returning True at the end, 1 for reading n, 2 for counting with a for loop and calling is_prime, 1 for the exact output."}]}, "drills": [["Write a for loop that prints the numbers from 50 down to 2 in steps of 4 (50, 46, 42, ..., 2).", "for i in range(50, 1, -4):\n    print(i)"], ["Get an int from the user and store it in a variable called age, all in one line.", "age = int(input(\"Age: \"))"], ["Print the float price with exactly three decimal places.", "print(f\"{price:.3f}\")"], ["Print the two rightmost digits of the integer i.", "print(i % 100)"], ["Assign to x the result of (-b + sqrt(b squared - 4ac)) / (2a), using the math module.", "x = (-b + math.sqrt(b ** 2 - 4 * a * c)) / (2 * a)"], ["Assign a random integer from 1 to 6, inclusive, to die.", "die = random.randint(1, 6)"], ["Triple y if y is greater than 100.", "if y > 100:\n    y = y * 3"], ["Write a Boolean expression that is True if month is in the summer range 6 to 8, inclusive.", "6 <= month <= 8     (or  month >= 6 and month <= 8)"], ["Write a function hyp(a, b) that returns the hypotenuse of a right triangle with legs a and b.", "import math\ndef hyp(a, b):\n    return math.sqrt(a ** 2 + b ** 2)"], ["Give the type and value of each: (a) 7 // 2 + 1.0   (b) int(7 / 2)   (c) \"5\" * 3   (d) 3 + 4 % 3 ** 2   (e) 2 * 3 ** 2", "(a) float 4.0   (b) int 3   (c) str \"555\"   (d) int 7 (4 % 9 is 4)   (e) int 18"], ["Write a function avg_in(n) that asks the user for n numbers (floats) and returns their average.", "def avg_in(n):\n    total = 0\n    for i in range(n):\n        total += float(input(\"Number: \"))\n    return total / n"], ["Write one line that calls avg_in for 5 numbers and prints the result to 1 decimal place.", "print(f\"{avg_in(5):.1f}\")"], ["Keep asking for a number until the user enters one from 1 to 10 inclusive, then store it in n.", "n = int(input(\"1-10: \"))\nwhile n < 1 or n > 10:\n    n = int(input(\"1-10: \"))"], ["Print the first 10 multiples of n on one line, separated by spaces.", "for i in range(1, 11):\n    print(n * i, end=\" \")"], ["Write a function that adds up numbers entered by the user until they enter 0, and returns the sum (0 is not added).", "def sum0():\n    total = 0\n    x = int(input(\"Number: \"))\n    while x != 0:\n        total += x\n        x = int(input(\"Number: \"))\n    return total"], ["The island of Mod has coins worth 1, 15 and 35 cents. Read a number of cents and print the minimum number of coins. (Hint: the greedy approach does not always work. Try every possible number of 35s and 15s.)", "c = int(input(\"Enter the number of cents: \"))\nbest = c\nfor big in range(c // 35 + 1):\n    for mid in range((c - 35 * big) // 15 + 1):\n        units = c - 35 * big - 15 * mid\n        if big + mid + units < best:\n            best = big + mid + units\nprint(\"Minimum number of coins:\", best)"], ["Write a program that reads a total number of seconds S (at least 60, otherwise print an error and stop) and prints it as hours, minutes and seconds, then the time in hours to 1 decimal. Example: 7684 prints 2 h 8 m 4 s = 2.1", "S = int(input(\"S: \"))\nif S < 60:\n    print(\"Must be at least 60 seconds.\")\nelse:\n    h = S // 3600\n    m = S % 3600 // 60\n    s = S % 60\n    print(f\"{h} h {m} m {s} s = {S / 3600:.1f}\")"], ["Write a function roll_dice(n=2, sides=6) that returns the total from rolling n dice. Use the accumulator pattern.", "import random\ndef roll_dice(n=2, sides=6):\n    total = 0\n    for i in range(n):\n        total += random.randint(1, sides)\n    return total"], ["Two players take turns rolling one die. A 1 scores 0 points, any other roll scores that many points. First to 50 or more wins. Print Player __ wins with __ points.", "import random\np1 = 0\np2 = 0\nturn = 1\nwhile p1 < 50 and p2 < 50:\n    roll = random.randint(1, 6)\n    if roll == 1:\n        roll = 0\n    if turn == 1:\n        p1 += roll\n        turn = 2\n    else:\n        p2 += roll\n        turn = 1\nif p1 >= 50:\n    print(f\"Player 1 wins with {p1} points\")\nelse:\n    print(f\"Player 2 wins with {p2} points\")"], ["Print how many positive factors each integer from 1 to n has, as efficiently as you can.", "n = int(input(\"Enter a positive integer: \"))\nfor i in range(1, n + 1):\n    count = 0\n    j = 1\n    while j * j <= i:\n        if i % j == 0:\n            count += 1 if j * j == i else 2\n        j += 1\n    print(f\"The integer {i} has {count} factor{'' if count == 1 else 's'}.\")"]]};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const TABS=[['cards','Flashcards'],['examA','Practice exam A'],['examB','Practice exam B'],['drills','Short drills']];
let state={};
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem('p13_'+k));localStorage.setItem('p13_'+k,JSON.stringify(v))}catch(e){return null}}
function nav(){const t=$('#tabs');t.innerHTML='';TABS.forEach(([id,l])=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('role','tab');b.setAttribute('aria-selected',cur===id);b.onclick=()=>{location.hash=id};t.append(b)})}
let cur='cards';
function route(){const h=location.hash.slice(1);cur=TABS.some(t=>t[0]===h)?h:'cards';nav();({cards:cardsView,examA:()=>examView('A'),examB:()=>examView('B'),drills:drillsView})[cur]()}
window.addEventListener('hashchange',route);

/* ---------- flashcards ---------- */
let deck=[],idx=0,flipped=false,known=new Set(store('known')||[]),cat='All',onlyReview=false;
function buildDeck(){deck=D.cards.map((c,i)=>({i,cat:c[0],f:c[1],b:c[2]})).filter(c=>(cat==='All'||c.cat===cat)&&(!onlyReview||!known.has(c.i)));idx=0;flipped=false}
function cardsView(){
 const cats=['All',...new Set(D.cards.map(c=>c[0]))];
 $('#view').innerHTML=`<div class="row"><select id="cat" aria-label="Category">${cats.map(c=>`<option ${c===cat?'selected':''}>${c}</option>`).join('')}</select>
 <button class="btn" id="shuf">Shuffle</button><label class="row" style="gap:6px;font-size:.9rem"><input type="checkbox" id="rev" ${onlyReview?'checked':''}> Hide cards I know</label><span class="stat" id="stat"></span></div>
 <div class="bar"><i id="pb"></i></div><div id="card"></div>
 <div class="row"><button class="btn" id="prev">Back</button><button class="btn bad" id="again">Still learning</button><button class="btn good" id="got">I know it</button><button class="btn" id="next">Next</button></div>
 <p class="hint">Click the card or press Space to flip. Arrow keys move between cards.</p>
 <div class="sec">Use these cards elsewhere</div>
 <p class="help">Copy the cards as tab-separated text, then paste into the Import box on Quizlet or Anki (front, tab, back, one card per line).</p>
 <div class="row" style="margin-top:8px"><button class="btn" id="copy">Copy all cards</button><span class="help" id="cmsg"></span></div>`;
 $('#cat').onchange=e=>{cat=e.target.value;buildDeck();drawCard()};
 $('#rev').onchange=e=>{onlyReview=e.target.checked;buildDeck();drawCard()};
 $('#shuf').onclick=()=>{for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;flipped=false;drawCard()};
 $('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
 $('#got').onclick=()=>mark(true);$('#again').onclick=()=>mark(false);
 $('#copy').onclick=copyAll;
 buildDeck();drawCard();
}
function go(d){if(!deck.length)return;idx=(idx+d+deck.length)%deck.length;flipped=false;drawCard()}
function mark(k){const c=deck[idx];if(!c)return;if(k)known.add(c.i);else known.delete(c.i);store('known',[...known]);go(1)}
function drawCard(){
 const c=deck[idx];const el=$('#card');if(!el)return;
 $('#stat').textContent=`${deck.length?idx+1:0} of ${deck.length} · known ${known.size}/${D.cards.length}`;
 $('#pb').style.width=(known.size/D.cards.length*100)+'%';
 if(!c){el.innerHTML='<div class="card"><div class="txt">No cards here. Untick "Hide cards I know" to see them all.</div></div>';return}
 el.innerHTML=`<div class="card ${flipped?'back':''}" id="cc" tabindex="0" role="button" aria-label="Flip card"><div class="cat">${esc(c.cat)} · ${flipped?'answer':'term'}</div><div class="txt">${esc(flipped?c.b:c.f)}</div></div>`;
 $('#cc').onclick=flip;
}
function flip(){flipped=!flipped;drawCard()}
document.addEventListener('keydown',e=>{if(cur!=='cards'||['TEXTAREA','SELECT','INPUT'].includes(e.target.tagName))return;
 if(e.key===' '){e.preventDefault();flip()}else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)});
function copyAll(){const t=D.cards.map(c=>c[1].replace(/\t/g,' ')+'\t'+c[2].replace(/[\t\n]/g,' ')).join('\n');
 const ok=()=>{$('#cmsg').textContent='Copied '+D.cards.length+' cards.'};
 const fb=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.minHeight='120px';$('#cmsg').after(ta);ta.select();$('#cmsg').textContent='Select and copy the text below.'};
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}}

/* ---------- exams ---------- */
const letters='abcde';
function fmtCode(c){return c?`<pre>${esc(c)}</pre>`:''}
function examView(k){
 const ex=D['exam'+k];const total=15+ex.app.reduce((a,x)=>a+x.marks,0);
 const key='ans'+k;let sel=store(key)||{};
 let h=`<div class="meta"><span class="timer" id="tm">60:00</span><button class="btn primary" id="st">Start 60-minute timer</button><button class="btn" id="rs">Reset answers</button></div>
 <p class="help">Do the real exam on paper: 15 multiple choice (15 marks), then three written questions (${total-15} marks). The real exam gives you 120 minutes; this one is trimmed for a study session. Total ${total} marks.</p>
 <div class="sec">Part 1: Multiple choice (15 marks)</div>`;
 ex.mc.forEach((m,i)=>{h+=`<div class="q" data-i="${i}"><h3><span class="num">${i+1}.</span>${esc(m.q)}</h3>${fmtCode(m.code)}`+
  m.opts.map((o,j)=>`<label class="opt" data-j="${j}"><input type="radio" name="q${i}" value="${j}" ${sel[i]==j?'checked':''}><span><b>${letters[j]}.</b> ${esc(o)}</span></label>`).join('')+`<div class="why" hidden></div></div>`});
 h+=`<div class="row"><button class="btn primary" id="chk">Check my answers</button><span class="score" id="sc"></span></div>
 <div class="sec">Part 2: Application (${total-15} marks)</div>`;
 ex.app.forEach((a,i)=>{h+=`<div class="q"><h3><span class="num">${16+i}.</span>${esc(a.title)} <span class="marks">[${a.marks} marks]</span></h3><div class="prompt">${esc(a.q)}</div>
  <textarea id="ta${k}${i}" placeholder="Write your answer here, or do it on paper." aria-label="Answer ${16+i}"></textarea>
  <button class="btn" data-sol="${i}">Show solution and marking</button><div id="sol${i}" hidden><pre>${esc(a.sol)}</pre><div class="scheme"><b>Marks:</b> ${esc(a.marks_scheme)}</div></div></div>`});
 $('#view').innerHTML=h;
 document.querySelectorAll('input[type=radio]').forEach(r=>r.onchange=e=>{const q=+e.target.name.slice(1);sel[q]=+e.target.value;store(key,sel)});
 $('#chk').onclick=()=>{let s=0;document.querySelectorAll('.q[data-i]').forEach(q=>{const i=+q.dataset.i,m=ex.mc[i];
   q.querySelectorAll('.opt').forEach(o=>{o.classList.remove('right','wrong');const j=+o.dataset.j;if(j===m.ans)o.classList.add('right');else if(sel[i]===j)o.classList.add('wrong')});
   const w=$('.why',q);w.hidden=false;w.textContent=(sel[i]===m.ans?'Correct. ':(sel[i]===undefined?'Not answered. The answer is '+letters[m.ans]+'. ':'The answer is '+letters[m.ans]+'. '))+m.why;if(sel[i]===m.ans)s++});
   $('#sc').textContent=`Multiple choice: ${s} / 15`};
 $('#rs').onclick=()=>{store(key,{});examView(k)};
 document.querySelectorAll('[data-sol]').forEach(b=>b.onclick=()=>{const s=$('#sol'+b.dataset.sol);s.hidden=!s.hidden;b.textContent=s.hidden?'Show solution and marking':'Hide solution'});
 let t=null,left=3600;const tm=$('#tm');
 $('#st').onclick=()=>{clearInterval(t);left=3600;t=setInterval(()=>{left--;tm.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(t);tm.textContent='Time is up'}},1000)};
 window.addEventListener('hashchange',()=>clearInterval(t),{once:true});
}

/* ---------- drills ---------- */
function drillsView(){
 let h=`<p class="help">Short questions in the style of the instructor's study set. Try each on paper first, then reveal the answer.</p>`;
 D.drills.forEach((d,i)=>{h+=`<div class="q"><h3><span class="num">${i+1}.</span>${esc(d[0])}</h3><button class="btn" data-d="${i}">Show answer</button><div id="d${i}" hidden><pre>${esc(d[1])}</pre></div></div>`});
 $('#view').innerHTML=h;
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const s=$('#d'+b.dataset.d);s.hidden=!s.hidden;b.textContent=s.hidden?'Show answer':'Hide answer'});
}
route();
</script>

</body></html>
